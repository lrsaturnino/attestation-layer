#
# Operating-point decision (ADR 0204 §4.1): no live non-drafting model is activated — every
# role x provider exceeds the FA=0 / exact-match bar under prompt v0.1. decomposition is the
# strongest role (run-claude 11/12 matched, FA=0) and the tracked first-releasable live role;
# extraction is the weakest (0/12 on both providers) and needs the most prompt work. The
# zero-config default (anthropic, pinned models) is the shipped operating point for all five
# roles (the recorded path is the release-validated one). A prompt revision that produces a
# viable operating point is re-run across both providers via `benchmark-role --run --llm-client
# cli:<wrapper>:3` and appended here + activated in this file.
#
# ── Example: cross-provider cli operating point (§6 landed for run-claude + run-gpt) ───
# The operator wrappers run-claude + run-gpt ARE §6-eligible (emit the sidecar + honor the
# pure-completion profile under NLREQ_ATTESTATION=1, ADR 0204 §5); run-oss/run-oss-local/
# run-gemini are attestation-ineligible (refuse upfront). A recommended cross-provider
# decomposition ensemble + audit would be configured via env or a machine-level file (NOT
# here — wrappers are operator-private, ADR 0202). Illustrative:
#
#   [decomposition]
#   client = "cli"
#   wrapper = "run-claude"
#   tier = "2"
#   model_env = { CLAUDE_TIER2_MODEL = "claude-haiku-4-5-20251001" }
#
#   [audit]
#   client = "cli"
#   wrapper = "run-gpt"
#   tier = "2"
#
# (Per-call cross-provider ensembles use the `cli:<wrapper>` scheme directly, e.g.
#  `--ensemble-client cli:run-claude --ensemble-client cli:run-gpt`, which is the
#  recommended two-provider decomposition operating point — ADR 0204 §1.)
