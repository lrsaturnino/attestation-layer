name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # `--extra formal` installs cvc5, the second formal backend (PB-6.T2). As with Apalache below,
      # CI installs the real solver so the cross-backend evidence is genuine, not skipped: without it
      # the cvc5-vs-z3 agreement tests degrade to honest skips and the second-backend projection is
      # never exercised in CI. cvc5 ships self-contained manylinux wheels, so no separate binary step
      # is needed.
      - name: Sync dependencies
        run: uv sync --extra dev --extra formal

      # The default S ∧ R consistency check runs a real Apalache model check (PB-1/PB-2). Install
      # the pinned, checksum-verified binary so CI exercises the real checker — without it the
      # real-Apalache tests skip and the default gate degrades to tool_error, i.e. the S ∧ R
      # evidence would be nominal, not real. Apalache's launcher runs `java`, so a JDK 17 must be
      # on PATH first.
      - name: Set up JDK 17 (Apalache runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install formal backends (Apalache)
        run: |
          scripts/install_formal_backends.sh --apalache-only
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      # The Solidity vertical (PC-3/PC-4) drives the real Slither analyzer and the real Foundry
      # toolchain. Install both so CI exercises genuine tool-backed symbol resolution, call graphs,
      # and Foundry-extracted traces instead of the honest skips the tests fall back to when the
      # tools are absent. Standalone Slither compiles via solc (Foundry brings its own), so a pinned
      # solc must be on PATH for the Slither tests to run.
      - name: Install Foundry (forge/cast)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Slither and solc
        run: |
          pipx install slither-analyzer
          pipx install solc-select
          solc-select install 0.8.17
          solc-select use 0.8.17
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      # Fail loudly if the Solidity toolchain did not install. Without this a botched install would
      # leave the tools absent, the PC-3/PC-4 tests would silently skip, and CI would go green
      # without ever exercising the real Slither/Foundry verticals — the opposite of the intent.
      - name: Verify Solidity toolchain is present
        run: |
          slither --version
          forge --version
          solc --version

      # The Go vertical (PC-6/PC-7/PC-8) drives the real Go toolchain: gopls for symbol resolution,
      # callgraph for the CHA call graph, and `go test -trace` + the vendored x/exp/trace reader for
      # runtime-trace extraction. Pin Go to 1.26 to match the trace format the vendored reader
      # supports (the runtime/trace format is coupled to the producing toolchain version) — without
      # it the PC-6/PC-7/PC-8 tests skip and the real Go vertical is never exercised in CI.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install gopls and callgraph
        run: |
          go install golang.org/x/tools/gopls@v0.22.0
          go install golang.org/x/tools/cmd/callgraph@v0.45.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Fail loudly if the Go toolchain did not install, mirroring the Solidity verify step: a botched
      # install would leave the tools absent, the PC-6/PC-7/PC-8 tests would silently skip, and CI
      # would go green without ever exercising the real Go vertical.
      - name: Verify Go toolchain is present
        run: |
          go version
          gopls version
          callgraph --help 2>&1 | head -1 || true
          command -v callgraph

      - name: Check schema drift
        run: uv run python scripts/check_schema_drift.py

      # PC-12: the commit-triggered spec-freshness gate (Cargo.lock-style staleness). It recomputes
      # the covered module's source + reviewed-spec hashes and FAILS when they drift from the committed
      # lockfile without it being re-baselined — i.e. a covered module changed but its reviewed spec S
      # was not re-validated, the state that blocks S ∧ R. requirements/spec-freshness/ is a
      # self-contained demo config (one source module + one reviewed spec) so the gate runs on every
      # push: it passes in a clean tree and blocks an un-revalidated edit.
      - name: Check spec freshness
        run: |
          uv run nlreq spec-freshness-check \
            --manifest requirements/spec-freshness/manifest.json \
            --registry requirements/spec-freshness/registry.json \
            --lockfile requirements/spec-freshness/lockfile.json \
            --project-root .

      - name: Run tests
        run: uv run pytest

      - name: Validate committed packages
        run: uv run nlreq validate-all requirements
