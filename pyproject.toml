[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlreq"
version = "0.1.0"
description = "General-purpose controlled requirement attestation core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "lark>=1.1.9",
  "pydantic>=2.0",
  "z3-solver>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
llm = [
  "anthropic>=0.25",
]
# The optional cvc5 second formal backend (PB-6.T2). Kept out of the base install — cvc5 is a heavy
# native solver and the backend degrades honestly to "unsupported" when it is absent. Enable with
# `uv run --extra formal` (or `uv run --with cvc5`) to exercise the real cvc5 evidence path.
formal = [
  "cvc5>=1.3",
]

[project.scripts]
nlreq = "nlreq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlreq = ["grammar.lark", "dsl_v2.lark", "dsl_v3.lark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.sources]
